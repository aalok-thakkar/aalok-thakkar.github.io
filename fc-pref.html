rn g.jsx("button",{type:"button",onClick:n,disabled:r,className:`text-left p-3 border transition-colors ${r?"opacity-40 cursor-not-allowed border-gray-200":t?"border-gray-900 bg-gray-50":"border-gray-200 hover:border-gray-400"}`,children:g.jsxs("div",{className:"flex items-baseline justify-between gap-3",children:[g.jsxs("div",{children:[g.jsx("div",{className:"text-sm",children:e.name}),g.jsx("div",{className:"text-xs text-gray-400 mt-0.5",children:e.code})]}),g.jsx("span",{className:`text-xs ${t?"text-gray-900":"text-gray-300"}`,children:t?"✓":"+"})]})})}function dx({rankedCourses:e,courses:t,onMoveUp:n,onMoveDown:r,onRemove:o}){return e.length===0?g.jsxs("section",{children:[g.jsx("h3",{className:"text-sm font-bold mb-1",children:"Your ranking"}),g.jsx("p",{className:"text-xs text-gray-400",children:"Empty. Add courses below."})]}):g.jsxs("section",{children:[g.jsx("h3",{className:"text-sm font-bold mb-3",children:"Your ranking"}),g.jsx("ol",{className:"space-y-1",children:e.map((i,a)=>{const s=t.find(h=>h.id===i),l=a===0,u=a===e.length-1;return g.jsxs("li",{className:"flex items-center gap-4 py-2 border-b border-gray-100",children:[g.jsx("span",{className:"text-xs text-gray-400 tabular-nums w-6",children:String(a+1).padStart(2,"0")}),g.jsxs("div",{className:"flex-1",children:[g.jsx("div",{className:"text-sm",children:s.name}),g.jsx("div",{className:"text-xs text-gray-400 mt-0.5",children:s.code})]}),g.jsxs("div",{className:"flex items-center gap-3 text-xs",children:[g.jsx("button",{onClick:()=>n(i),disabled:l,className:"text-gray-400 hover:text-gray-900 disabled:opacity-30 disabled:hover:text-gray-400","aria-label":"Move up",children:"↑"}),g.jsx("button",{onClick:()=>r(i),disabled:u,className:"text-gray-400 hover:text-gray-900 disabled:opacity-30 disabled:hover:text-gray-400","aria-label":"Move down",children:"↓"}),g.jsx("button",{onClick:()=>o(i),className:"text-gray-400 hover:text-gray-900","aria-label":"Remove",children:"✕"})]})]},i)})})]})}const fx=[{id:"fc1",name:"Environmental Studies",code:"FC-0102",description:"Course description TBD"},{id:"fc2",name:"Indian Civilisations",code:"FC-0201",description:"Course description TBD"},{id:"fc3",name:"Quantitative Reasoning and Mathematical Thinking",code:"FC-0306",description:"Course description TBD"},{id:"fc4",name:"Economy, Politics and Society",code:"FC-0412",description:"Course description TBD"},{id:"fc5",name:"Mind and Behaviour",code:"FC-0503",description:"Course description TBD"},{id:"fc6",name:"Great Books",code:"FC-0601",description:"Course description TBD"},{id:"fc7",name:"Literature and the World",code:"FC-0701",description:"Course description TBD"},{id:"fc8",name:"Principles of Science",code:"FC-0801",description:"Course description TBD"}],hx=[{id:"p1",name:"Sumedha Basu",lsCode:"FC-0102-5",description:`Climate change is one of the biggest challenges of our time—and of the future. To respond to it, we first need to understand its wide-ranging relationships with nature, society and our everyday lives. Through this course, I seek to make these complex interrelationships accessible while building a strong analytical foundation for you. To this end, we will begin with the basics of climate science and the tools we use to study it. From there, we will engage with the different frameworks—both historical and current—that shape how people and governments think about climate change. Informed by these frameworks, we study the three key pillars of response: vulnerability assessment, mitigation, and adaptation.

 We will then explore the social, political, and economic dimensions that shape climate change and, in turn, are shaped by it. We finally examine the implications of these factors on our shared future. We look at alternative frameworks, technologies, and models gaining traction, and finally consider why hope in the era of climate change should be the new politics.

 The course will be taught through:

* Lectures to introduce core concepts
* Class discussions on cases and real-life examples
* Films and documentaries to visualise impacts and solutions
* Group projects to practice collaboration and problem-solving

 Throughout the course, we will learn about critical thinking, tools to comprehend the underlying layers of the challenge, assess the scope for resistance and create new pathways.`,time:"Tue-Thu 3:00 PM"},{id:"p2",name:"Asmita Kabra",lsCode:"FC-0102-2",description:"The course aims to introduce students to a complex, interdisciplinary understanding of environmental issues and challenges, going beyond simplistic discourses of crisis. The pedagogic design is built around ten questions, framed in very simple terms but designed to crack open disciplinary silos to build a multivalent understanding of linked socioecological systems. It exposes students to a diversity of environmental issues, challenges, processes, perspectives, and actors. The objective is to enable students to gain a more nuanced and historicized understanding of the politics of environmental policy and practice.",time:"Mon-Wed 8:30 AM"},{id:"p3",name:"Mitul Baruah",lsCode:"FC-0102-4",description:"This course is meant to introduce students to nature-society dialectics. We will examine the historical, social, and political processes that shape societal relations with the natural environment. The course has three overarching goals. First, it will help students gain an in-depth understanding of some of the pressing environmental issues of our times, such as the agrarian crisis, climate change, disaster and vulnerability, waste, the industrial food system, struggles over water, and neoliberalization of nature, among others. Second, drawing on a variety of theoretical frameworks, including Marxist, feminist, and post-structuralist perspectives, the course will expose students to a breadth of approaches to environmental questions. Finally, through this course, I hope to be able to cultivate a sense of environmental citizenship in students. The course will be taught using a combination of lectures, discussions, films, and group projects.",time:"Tue-Thu 10:10 AM"},{id:"p4",name:"Amita Baviskar",lsCode:"FC-0102-1",description:"Any environmental issue is invariably about society and politics.  From global warming to garbage on city streets, nature and culture lie at the centre of competing claims about what should be done.  As Raymond Williams said, “We have mixed our labour with the earth, our forces with its forces too deeply to be able to separate each other out.”  Understanding these processes of ‘socio-nature’ demands a focus on social inequality as well as biological complexity.  This course looks at how biophysical processes in natural landscapes are changed by the cultural geography of capitalism, colonialism, caste and nationalism.  We will analyse environmental crises and explore how collective action can lead to ecological justice.",time:"Tue-Thu 11:50 AM"},{id:"p5",name:"Ghazala Shahabuddin",lsCode:"FC-0102-3",description:`Overview:

The contemporary world is beset with growing environmental problems. The global focus on economic growth and development has led us onto an unsustainable path: growing scientific evidence now suggests that the Earth may not be able to cope with the demands imposed on it.  This has created an urgent need to critically examine complex environmental issues from a variety of perspectives. It is necessary to inculcate holistic thinking on environmental challenges and their purported solutions, that includes concerns of social and ecological sustainability.

This course will discuss some of the most current concerns related to the environment, as well as societal responses to them, from a multidisciplinary perspective. Water scarcity, climate change, forest degradation, biological extinction, pollution and agrarian distress are some of the issues that will be studied. This course is intended to familiarise students with environmental problems  and engender a holistic perspective in understanding causes and possible solutions through the lenses of both science and equity. This course will encourage students to synthesize information across a variety of sources.

Practically the course will be taught using a combination of lectures, documentaries, slideshows, guest lectures and in-class group discussions. Discussion on assigned readings will engender critical thinking and debate in class. Students will undertake group projects on current case studies (such as river pollution, tiger tourism etc.). Assessments will be based on in-class tests, essays, group projects and class participation.`,time:"Mon-Wed 11:50 AM"},{id:"p6",name:"Nayanjot Lahiri",lsCode:"FC-0201-3",description:"This is a small course about a large and fascinating subject, that of Indian Civilizations. It has been structured in a way that it can be immersed in, one hopes, with enjoyment. The course will draw out civilizational elements from prehistory till the present – through accounts of travels and lives, through ideas and  through art – in which small phenomena are linked to the larger frame of the Indian subcontinent and beyond. The course will explore a varied and rich tapestry that includes rock art, the Harappan Civilization, iconic emperors like Ashoka and Akbar, the words of the Buddha and the Bhakti saints, modern statesmen like B.R. Ambedkar and Jawaharlal Nehru. How social and gender inequalities cut across Indian history will also  be explored.  Indian civilizations, as the course will emphasize, are not   part of the 'old' and  ‘dead’ past but  are made up of elements that continue to be present in contemporary India. Readings will be electronically shared with students.",time:"Mon-Wed 11:50 AM"},{id:"p7",name:"Amar Farooqui",lsCode:"FC-0201-1",description:"The study of India’s past in the modern period has produced diverse understandings of Indian civilizations. This course looks at some of the ways in which these understandings have evolved, by discussing the writing of history, notions of heritage, anti-colonial resistance, nationalist thought and memories of exile. We shall explore how histories of representative monuments, rulers, cities or commodities allow us to comprehend the historical processes that have shaped Indian civilizations.",time:"Tue-Fri 8:30 AM"},{id:"p8",name:"Gaurav C. Garg",lsCode:"FC-0201-2",description:"This course takes an intellectual history approach to the study of Indian civilizations. It considers civilization as an actor category. It explores how different conceptualizations of civilization have shaped India, and how India has shaped the concept of civilization. We will focus mainly but not exclusively on British/Western colonialists and thinkers on one hand and South Asian intellectuals on the other to embark on a journey that will begin from the middle of the eighteenth century and go right up to the present.",time:"Wed-Fri 8:30 AM"},{id:"p9",name:"Subhashis Banerjee",lsCode:"FC-0306-4",description:`This course will introduce students to the basics of mathematical and logical reasoning, algorithmic thinking, and data-driven analysis. The course will use examples from diverse fields to highlight the importance of these in a problem-solving approach. The course will have a strong emphasis on computational thinking.

Please see the course web page (https://subhashis-banerjee.in/Courses/QRMT_Monsoon2026/) for an overview of the coverage.`,time:"Mon-Wed 8:30 AM"},{id:"p10",name:"Mihir Bhattacharya",lsCode:"FC-0306-2",description:"The course will begin with pre-requisite tools of quantitative thinking vis-a-vis the number system, set theory, logic, proofs, probability and statistics. We will then learn how to use some of these tools to study (i) fairness in division of scarce resources, (ii) collective decisions in committees and democracies around the world (voting methods), and (iii) how to act optimally in competitive social interactions, i.e. game theory. By the end of the course, students would have a basic understanding of the most widely used mathematical tools in the liberal arts. They will learn how to approach different economic problems- by reducing them to their bare essentials (via modelling) and to mathematically analyse their underlying structural and logical patterns.",time:"Tue-Thu 3:00 PM"},{id:"p11",name:"Sandeep Juneja",lsCode:"FC-0306-3",description:`Mathematical ideas often based on data and analysis play a key role in understanding the world around us and in making rational decisions.  This course will focus on consequential real world problems and discuss the underlying mathematical ideas that illuminate the problem structure and help us make more informed and better decisions.

The questions we consider include the ones that rely on taming uncertainty such as

·      What do income inequality, damage from earthquakes and size of cities have in common?

·      How to estimate and manage supplies at an Ashoka Coffee shop

·      How do fashion stores decide how many clothes to order in a business cycle

·      How tools such as the Monte Carlo method help us measure and control disease spread

·      How to make profitable investments in stock markets

·      The underlying mathematical principles in pricing financial derivatives securities

As well as those that involve problems under certainty assumptions, such as

·      How do utility companies decide how much electricity to generate from various power sources (coal, natural gas, nuclear, solar, wind) hour by hour?

·      How to estimate a price of a home from data such as square footage, number of bedrooms, location rating, age of the property, and local crime rates.

·      How do banks feed historical customer data (income, debt, repayment history) into machine learning models to evaluate a new applicant's risk level and automatically approve or deny lines of credit

·      How can individual rational decisions lead to a collectively terrible outcome?

·      Can a group of men and women be matched in a stable manner so that there is no pair of individuals who would both prefer to leave their assigned partners to be with each other.

·      How Google finds the shortest path from your home town to Ashoka University

Along the way, students will encounter introductory ideas from probability, statistics, optimization, regression, machine learning, game theory, matching theory, and graph algorithms.  By the end of the course, students will be able to recognize mathematical structure in unfamiliar situations and reason carefully with data and uncertainty. The broader aim is to develop a form of intellectual independence: the ability to look beneath the surface of a problem and identify its underlying structure.`,time:"Tue-Thu 3:00 PM"},{id:"p12",name:"Chandan Singh Dalawat",lsCode:"FC-0306-1",description:`Mathematics is a fundamental part of human culture, dealing with truth and beauty. It can be viewed as a world governed by logic and reason which we discover using our intuition and creativity. It is also an indispensable tool for all other sciences and thereby essential to understanding the world we live in.

This course will introduce some of the simplest and most basic mathematical ideas. These include sets and mappings, logic and reasoning, graphs and networks, groups and symmetries, modular arithmetic, discrete probability, and a bit of statistics.

Every concept will be illustrated with numerous examples. Emphasis will be placed on precision and clarity. Students are expected to imbibe the idea of a mathematical proof, and to apply their knowledge to concrete problems.`,time:"Tue-Thu 8:30 AM"},{id:"p13",name:"Ravindran Sriramachandran",lsCode:"FC-0412-3",description:`This course introduces students to seminal writings on the intertwined trajectories of economy, politics, and society in the Indian subcontinent during the emergence of modernity. It traces the evolution of modern South Asia from 1818 to 1947, examining key social, political, and economic transformations under colonial rule.

We will explore major figures who engaged with — and shaped — the political and social struggles of the period, alongside critical debates on religious reform, women’s roles, caste hierarchies, communalism, and nation formation. Special attention will be given to the complexity of colonial governance, economic change, and social contestations.

Students will engage with a range of primary texts — including autobiographies, speeches, political treatises, ethnographies, and literary fiction — to analyze how ideas of economy, politics, and society were debated and reimagined in colonial South Asia.

Course Goals:

* Read, think, and evaluate critically about modern South Asian economy, politics, and society
* Acquire foundational knowledge of major historical and political developments in modern South Asia
* Understand key figures, movements, and debates that shaped South Asian society and politics under colonialism
* Examine the economic underpinnings of colonial rule and their impact on society and politics
* Understand the emergence and construction of communalism in the region
* Develop skills to critically analyze primary sources and debates`,time:"Mon-Wed 3:00 PM"},{id:"p14",name:"Uday Chandra",lsCode:"FC-0412-5",description:`What makes a society just, prosperous, and worth living in? Questions of the common good cannot be answered by economics, political science, sociology, philosophy, or environmental studies alone. They require us to move between moral ideas, empirical realities, institutional arrangements, and lived experience.

This foundation course examines how states, markets, communities, and other institutions organize collective life. We shall study how societies produce order, distribute resources, manage conflict, define belonging, respond to inequality, and confront environmental and technological change. Rather than treating states and markets as separate or opposing spheres, the course asks how they are historically constituted, socially embedded, and politically contested.

Students will learn to read across social science disciplines, reconstruct arguments, interpret evidence, and exercise judgment when reasonable people disagree. The aim is not to provide a single theory of the common good, but to develop the intellectual habits needed to think carefully about competing values, institutional choices, and their consequences.`,time:"Mon-Wed 3:00 PM"},{id:"p15",name:"Abheek Barua",lsCode:"FC-0412-1",description:`Why does the US have the lead in AI? What do vests and bank loans have in common? What is money and what does the Reserve Bank of India do? What does deglobalization mean and what do tariffs and controls on immigration by Western countries have to do with it? What is a budget and why do economists spend so much time worrying about government budgets? Is the Sensex a correct gauge of how the Indian economy is doing? Why are countries afraid of “Japanification”? What is China’s “ mayor economy”?

This course addresses a diverse range of issues in economics and public policy in a non-technical way. It emphasizes the intuition behind complex economic ideas and also explores the connections of economics with other disciplines – psychology, philosophy, finance, sociology and political science—for example. Finally, it  explores India specific problems such as the risk of a middle-income trap. The aim is to blend an understanding of current issues with the history of ideas to leave students with a quick but comprehensive idea of the science and art of economics.

 The course will use a diverse set of resources – short videos, excerpts from Yale and MIT open learning course, blogs and a simple textbook written by Nobel Laureate Paul Krugman.

Evaluation

4 quizzes: 50 per cent of total marks

Class participation: 15 per cent ( including discussion sessions)

Group project and presentation: 35 per cent

Attendance requirement:

While there will be no attendance requirements, there is a score for class participation. The project as well as the quizzes will be based on material taught in class that might not follow

Textbook

Essentials of Economics: Paul Krugman, Robin Wells and Martha Olney, Worth Publishers`,time:"Tue-Fri 3:00 PM"},{id:"p16",name:"Arun Sukumar",lsCode:"FC-0412-2",description:`This course puts the I in EPS. Few social, political, or economic movements can be understood in isolation from their international context. Their triggers may be local, but the ideas, people, money, and technologies that mobilise them travel. We will therefore read economy, politics, and society in comparative perspective, unearthing shared intellectual undercurrents and the material impact of watershed events across time and geography. We will pay particular attention to global markets as shapers of political and social developments.

Rather than starting with theory, the course is organised around ebbs and flows in societies.  We will connect social upheaval to disruption in markets, understand the role coercion plays in international political economy, ground the origins of economic life in religion and dogma, and frame technology as a vehicle for political engineering. When we do go through canonical texts, it will mostly be to understand societies in convulsion: Luther's Europe, Smith's Scotland, Meiji Japan, Weimar Germany, Mao's China and Malviya’s Benares for example. Technology will play a starring role in this course -- and although you are not expected to have a legal background, we will occasionally analyse legal texts both as an instrument of powerful interests and a resistance tool for social movements.

This is a reading-intensive course with 40% of the grade earmarked for classroom discussions. No laptops allowed in class.`,time:"Wed-Fri 8:30 AM"},{id:"p17",name:"Surajkumar Thube",lsCode:"FC-0412-4",description:`Does Caste Still Matter in India Today?

“Democracy in India is a top-dressing on an Indian soil which is essentially undemocratic.” These words by Dr. Ambedkar in the Annihilation of Caste continue to compel us to critically reflect upon the myriad hurdles that have kept India away from fully realizing its democratic potential. For Ambedkar, one of the main social cleavages that resisted notions of equality and social justice was the pervasive phenomenon of caste in India. Achieving political freedom, as Ambedkar presciently reminded everyone, was no guarantee for realizing social freedom. Seven decades after India’s independence, how deeply entrenched is this social idea of democracy in India today? More specifically, how do we understand the role of caste in the chequered story of India’s democracy? Should caste only be understood as a pernicious form of social hierarchy or can it also be seen as an entity that has shaped the rise of ‘lower-caste’ identity assertion and led to the socio-economic upliftment of marginalized sections?

This course will introduce students to debates and discussions around why, how and in what ways caste shapes different facets of everyday life in contemporary India. With a thematic focus around politics, society and economy, this course will offer varied perspectives to meaningfully approach a deceptively simple question – ‘Does Caste Still Matter in India?’. The course will be divided into 3 categories. The first section will deal with how caste became politicized after 1947 by focusing on the rise of caste-based political parties and social movements in Uttar Pradesh, Maharashtra, and Tamil Nadu. The second section will introduce students to how caste continues to operate as a form of social hierarchy through seemingly egalitarian spheres of food, music, sport and educational institutions. The final section will focus on the complex role caste plays in the Indian economy by dealing with conceptual issues like ‘caste and class’, along with thematic issues like caste-based discrimination in labour markets, the gig economy, the question of Dalit capitalism, among others. This course will encourage students to think critically about these issues in relation to how the story of Indian democracy has unfolded over the years. It will provoke students to think of caste as the ‘undemocratic soil’ of a rapidly urbanizing India, and not treat it as a past relic or as a phenomenon that rears its ugly head only among rural, ‘backward communities’ and in underdeveloped regions of India.`,time:"Tue-Thu 4:40 PM"},{id:"p18",name:"Kranti Saran",lsCode:"FC-0503-3",description:`What kind of creature are you? A human being, no doubt. But what kind of creature is *that*? How should such a creature live? We will critically explore influential models of human nature in the Indic and Western philosophical traditions and their profound implications both for how we ought to live and our place in the social world. Readings include selections from the Upanishads, Vasistha's Yoga, Plato, Aristotle, Hume, Freud, Mill, Railton, Santideva, Korsgaard, Foot, O'Neill, Frye, Haidt, Milgram, Hobbes, Rawls, Bilgrami and others.

Note well: this is a fast-paced and demanding course for students who take pride in producing their own work rather than relying on AI. If you haven't read a single novel or a book over the summer, this course probably isn't for you.`,time:"Mon-Wed 11:50 AM"},{id:"p19",name:"Kathleen Harbin",lsCode:"FC-0503-4",description:"Is the essential nature of the human mind its capacity to reason, to feel, to grasp certain aspects of the world? Are our minds and ways of thinking fundamentally different from those of animals or various forms of artificial intelligence? By exploring a range of answers to these and other challenging questions, this course examines the nature of the human mind and what it can tell us about ourselves and our place in the world. We will consider whether the mind is identical with physical or brain processes or instead is something else over and above the physical world. We will explore the question of whether our minds enable us to make truly free choices or rather only to channel the influential forces in our environment. Finally, we will seek to understand some distinctive modes of thinking, such as the experience of awe.",time:"Tue-Thu 11:50 AM"},{id:"p20",name:"Bittu Kaveri Rajaraman",lsCode:"FC-0503-2",description:`This course will introduce you to questions of mind and behaviour and their relationship to the brain and body, and will encourage you to think critically and scientifically through your own ideas around these relationships. In this course we will try to understand ourselves, the people and animals around us, and all the ways in which our interactions produce learning. Every conversation, every memory, even your reading of this course outline, structurally and functionally changes your brain, but not everything that the brain processes seems to make it to the realm of conscious perception. We will think about various seemingly intangible aspects of the mind and try to imagine how to make sense of them.

We will take a look at complex and interesting phenomena such as motivation, emotion, language, consciousness and attention. We will explore the specific question of how we learn, how we absorb and retain new material, the ways in which our brains tend to conflate correlation and causation, how we make decisions, and what critical thinking means. We will think through inter individual behavioural differences and what kinds of evidence we require to draw conclusions about group behaviour. We will focus on the limitations of what we collectively understand and the ways in which we might imagine advancing our collective knowledge about the mind and behaviour.`,time:"Tue-Thu 11:50 AM"},{id:"p21",name:"Aarthy Vaidyanathan",lsCode:"FC-0503-1",description:`Emotions, Responsibility, and Morality  
Anger can sometimes be counterproductive. Can such anger be morally valuable nonetheless? Blaming seems detrimental in some clinical contexts. How can clinical service providers hold users morally responsible for wrongdoing without blaming them? We sometimes judge actions as morally right or wrong. But what *makes* an action morally right or wrong?  This course will introduce you to such questions about emotions, responsibility, and morality from a philosophical perspective.

Sample readings:  
Rachels, ‘The Challenge of Cultural Relativism.’  
Selections from Mill, Utilitarianism  
Singer, ‘Famine, Affluence, and Morality’  
Pickard, ‘Responsibility without Blame’  
Srinivasan, ‘The Aptness of Anger’`,time:"Wed-Fri 4:40 PM"},{id:"p22",name:"Madhavi Menon",lsCode:"FC-0601-3",description:"Not all narratives become books and not all books are termed great. Many fabulous tales are transmitted orally and several terrific ideas are communicated through non-verbal means like art. Of the millions of stories and ideas and arguments that are written down in book form, only a fraction has significantly impacted the world as we know it today. In this course, we will read several books and fragments of books that have shaped the ways in which we think about sexuality. These books come from different cultures, time periods, languages, and they cover different subjects. Nonetheless, they all have something significant to offer us as we think about one of the most universal yet thorny issues in the world today.",time:"Mon-Wed 8:30 AM"},{id:"p23",name:"Rudrangshu Mukherjee + Gopalkrishna Gandhi",lsCode:"FC-0601-4",description:`This course will be taught by Gopalkrishna Gandhi in the first half of the semester (till the mid semester break) and after the mid semester break by Rudrangshu Mukherjee.

The course will entail a deep engagement with six texts. Students must be prepared to read.

Professor Gandhi will take up the following texts

1.ANTHOLOGY OF FLOWERS: POEMS COMPILED AND ANNOTATED BY LORD WAVELL, 1944.

2. MISSION WITH MOUNTBATTEN BY ALAN CAMPBELL-JOHNSON, 1951

3.RADHAKRISHNAN: A BIOGRAPHY BY SARVEPALLI GOPAL, 1989.

Professor Mukherjee will take up

1.ISA UPANISHAD

2.BABUR NAMA

3. A ROOM OF ONE'S OWN BY VIRGINIA WOOLF`,time:"Tue-Thu 10:10 AM"},{id:"p24",name:"Arunava Sinha",lsCode:"FC-0601-2",description:"We will read select works by Nobel Laureates from around the world, works that have originated in various languages, cultures, histories, geographies, and systems of thoughts and beliefs, mediated by individual talent. We will read for themes that converge and diverge among what is now considered a canon of the 20th Century. We will, alongside the specificities of each text – which will comprise fiction, non-fiction, and poetry – also interrogate the idea of the canon, the notion of the market and literary awards, what constitutes literary excellence, and, finally, what it means to read translated texts.",time:"Mon-Wed 4:40 PM"},{id:"p25",name:"Arpita Das",lsCode:"FC-0601-1",description:`Memoirs by women that act as political beacons are the focus of this course. Each one is a stellar example of the genre we know as narrative non-fiction, and each one has been cited and referred to by generations of scholars, practitioners, activists, and students for whom equity and social justice are of importance. Over time, these memoirs have taken on a talismanic importance and yet, they age well with the times and remain supremely relevant. Is that something to celebrate in terms of the prescience of the texts themselves, or to lament in terms of how the world does not seem to become a more equitable place even over the decades since these texts were read for the first time.

The texts we will be reading: Karukku by Bama; The Prisons We Broke by Baby Kamble; Why Be Happy When You Can Be Normal by Jeanette Winterson; 'Memories of an un-Palestinian story, in a can of tuna' by Susan Abulhawa; Our Words, Our Stories by A. Revathi.

The final project which accounts for 50% of the course will be a group creative project based on any theme in the books we have read together during the semester and can take the form of a podcast, original song, short film, comic book, art installation, live performance, broadsheet or zine.`,time:"Tue-Fri 3:00 PM"},{id:"p26",name:"S. Satish Kumar",lsCode:"FC-0601-5",description:`This course seeks to reflect on care and love both conceptually and experientially. What does it mean to love and care for oneself and for others? What allows us to love and care? What prevents us from caring and loving ourselves and others? What forces—personal, interpersonal, or collective and communal—regulate, prescribe and even prohibit experiences and expressions of love.

Our primary goal in the course is to work towards developing a critical and comprehensive language around understanding care and love as the basis for any and all configurations of relationalities that both make and unmake our senses of being in the world. Beginning our journey with selections from The Symposium by Plato, verses from the Gatha Sattasai, and poetry from the Akam repertoire of Sangam literature, we will make our way through more contemporary iterations and meditations on caring and loving such as, Roland Barthes’ *A Lover’s Discourse* and Ocean Vuong’s *On Earth We Are Briefly Gorgeous*. All along the way we will be reflecting on and attempting to problematize “traditional” and “normative” structures within which care and love are usually understood and experienced.`,time:"Tue-Thu 4:40 PM"},{id:"p27",name:"Abir Bazaz",lsCode:"FC-0701-1",description:"What is literature? And what does it teach us about who we are, the world we live in, and where we are going? Does literature help us make better sense of the lives of others or the necessary strife involved in the human condition? Does literature put us more genuinely in touch with ourselves and one another? What is the relation between literature and politics? Or literature and religion? In this course, we will search for answers to some of these questions by reading modern literature from all over the world. We will be studying literary texts by Fyodor Dostoyevsky, Amton Chekhov, Franz Kafka, Ryunosuke Akutagawa, V.S. Naipaul, Tayeb Salih, Toni Morrison, Jorge Luis Borges and Flannery O’Connor among others.",time:"Tue-Thu 3:00 PM"},{id:"p28",name:"Vivek V. Narayan",lsCode:"FC-0701-4",description:`Literature lives in a strange place where the word meets the world: here, the fantastical can seem familiar and the mundane may seem bizarre. The act of reading allows us to imagine the strange worlds of others as if we lived in them, and, equally, to reimagine our everyday worlds as if we viewed them through unfamiliar eyes. This imaginative encounter with otherness—other people, other perspectives, other places, and other worlds—lies at the heart of the literary experience.

In South Asia, the literary encounter with otherness is inextricable from the worldly encounters of caste. The aesthetics of caste inform our literary sensibilities, the social experiences of caste frame the world we inhabit, and the everyday performances of caste shape our bodies. In short, the encounters that create our aesthetic, social, and embodied experiences—between the word and the world, between the self and the other, and between the real and the imagined—are all entangled with caste.

This course will examine the relationship between literature and the world by focussing on the aesthetic, social, and embodied experiences of caste. We will ask: What can caste and literature tell us about each other? What do the intersections of caste and literature tell us about the world? How does our experience of the world inform and inflect our responses to literary representations of caste? And, perhaps most important, how will this kind of literary experience help us inhabit the world? We will read fiction, nonfiction, poems, and plays to explore what literature can reveal about others, ourselves, and a world organized by caste.`,time:"Wed-Fri 4:40 PM"},{id:"p29",name:"Jonathan Gil Harris",lsCode:"FC-0701-2",description:`This class begins with the premise that every story is a migrant.  A story migrates in a variety of ways – from the teller to the audience or reader; but also from reader to reader, place to place, and culture to culture, as the story gets told and retold (or written and rewritten) over space and time.

We live in a capitalist age when ideas of private property have subtly colonized how we think about stories.  It is assumed that a story is always BY someone, and is therefore their possession.  But if stories migrate, can a single author really claim full ownership of the story she has written?  How is every story a re-imagining of another story, or many stories, that have become before?

The notion that a story is an author’s private intellectual property also inhibits how we read.  Readers become potential trespassers; they must pay the price of admission, and then act respectfully when they enter the property, making sure not to damage or alter it.  If you are a student of literature, it’s likely that the command to respect an author’s private property will be accompanied by the assumption that the objective of literary analysis is simply to understand what the author intended, and to submit to that deferentially.  But if stories migrate from teller to reader, and from reader to reader and culture to culture, maybe the act of reading should not be thought of just as a respectful encounter with an author’s private property.  Every act of reading instead becomes a creative re-imagining of the story, in conversation with new potential readers and audiences.

If stories are migrants, then they are no longer individual property by authors who command their readers.  They are collective artefacts that invite us to respond creatively and re-imagine them anew.

If you doubt what I am saying, think this.  Do any two readers respond exactly the same way to a story?  Each reader, when asked about a story and what it meant, will retell it slightly differently.  Recognizing that reading is a form of creative re-imagining is one of this course’s most important themes.

As stories migrate across space, time, and languages, they are re-imagined by the world across many genres and media – poems, plays, novels, essays, films, graphic novels.  These re-imaginings might prove that, in literature, there is nothing original under the sun.  Yet how literature reimagines earlier stories also tells us a lot about the extraordinarily diverse ways in which different cultures have understood the world: relations between men and women, relations between diverse ethnicities and religions, the nature of political and social power, humans’ relations to the animal and plant world, the agonies and ecstasies of love, and the nature of imagination itself.

How, for example, is a Roman re-imagining of an old Greek story about an Asian witch re-imagined by an English playwright in an “American” drama that has itself been re-imagined in very different ways by writers and artists from the Caribbean, Sierra Leone, Mauritius, and Samoa?  How is a Roman re-imagining of a Babylonian (ie Iraqi) love story reworked by the same English playwright in a Greek mythic tale with an Asian subtext that gets in turn re-imagined by a Bombay director in Hindi, Punjabi, Urdu and English as well as by an English graphic novelist in a reworking of an American comic-book hero’s saga based on a character from a German short story?  And how is an antique Persian story about an African migrant re-imagined in an Arab novel and then re-imagined by the same English playwright, whose play is then diversely re-imagined by a Sudanese novelist and a Hindi film-maker from Uttar Pradesh?`,time:"Mon-Wed 11:50 AM"},{id:"p30",name:"Saikat Majumdar",lsCode:"FC-0701-3",description:`What is liberal arts education? Is it identified with particular subjects, or a certain style of teaching and learning? This course will offer an introduction to liberal arts education as it might be practiced in a literature classroom for non-specialists, including students who may major in any subject at Ashoka – a be it literature, economics, or biology. Our focus will be on English as a world language, and particularly one of global literature. How did the British Empire shape a global terrain of colonial modernity? How did that modernity merge with Anglo-American globalization of the twentieth and twenty-first centuries? How did this create the English-speaking and English-reading worlds, and how did it turn English into a

language of world literature? We will examine the transnational trajectory of this diverse and diffuse body of writing, including work from spaces with vastly different histories – the colonies in sub-Saharan Africa, the Caribbean and South Asia, and the hard-to-classify context of South Africa.

Evaluation: Attendance: 10%; Group presentation: 20%; Midterm: 30%; Final Exam: 40%; DS Attendance: 10%`,time:"Tue-Thu 3:00 PM"},{id:"p31",name:"Sujan Sengupta",lsCode:"FC-0801-5",description:`Planet Earth: Its status in the Universe, potential threats and the ultimate fate.

  A formidable combination of astronomical and geological conditions has made it possible for the Earth to harbour life on it. But there are many catastrophic events in the space that may destroy life, even the planet which in the vast cosmic arena appears as a mote of dust suspended in a beam of sunlight and floating in the vast emptiness of space.  Search for extra-terrestrial life has taught us an important lesson that our world, mother Earth is an extremely rare place in our galaxy and possibly the only planet that has the required astrophysical and geological conditions for harbouring life. Even if there are other planets similar to the Earth wherein life may exist, the number of such planets in the vast galaxy is extremely small and so we are alone at least within a radius of few hundreds of light years. 

    This course will unfold the fact that our home, the planet Earth is so special yet so vulnerable, so crowded yet so lonely, so common yet so unique, so insignificant yet so great! 

        The following topics will be covered in the whole course: 

    (i)   Our address in the Universe, the boundary of the solar system, the solar neighbourhood and the hierarchy in the structure of the                              visible Universe. A brief history of the solar planets.  

   (ii)   Birth of the Sun and its planets including the Earth. We are made of star dust – the origin of heavy elements including carbon- the building block of organic molecules. 

  (iii)   The Solar family – Mercury, Venus, Mars, Jupiter, Saturn, Uranus and Neptune. Pluto and the other dwarf planets. Moons of the solar planets. 

  (iv)   Planet Earth – its evolving geology and the atmosphere. The Oceans- where has so much water come from? The ecological system.   

   (v)   Life is a puzzle: Definition of life- its main functions: metabolism, replication and evolution by natural selection.  Origin of life on the Earth. The Extremophiles  

  (vi)   The potential threats to the Earth – Astronomical, Geological and Man-made threats. Extinction of life in the past. 
(vii)  The natural protection for life – The extremely rare combination of astronomical and geological coincidences that has enabled   life on the Earth to survive and evolve.
(viii)   Are we alone? Search for extra-terrestrial bio-signature and techno-signature.

  (ix)  The evolution of the Sun – from a faint young star to a red giant and a changing environment of the Earth – from habitable to    uninhabitable planet. 

   (x)  The death of the Sun and the fate of its planets.`,time:"Mon-Wed 3:00 PM"},{id:"p32",name:"Abhishek Mazumder",lsCode:"FC-0801-1",description:`Biology is often introduced as a tidy catalogue of organisms, organs, and processes—a view of life described from the outside in. This course argues that to truly understand biology, one must first understand its molecules, and that most biological phenomena emerge from the choreography of molecules colliding, binding, folding, and breaking apart. As the course unfolds, students will discover that nearly every major breakthrough and intervention in modern biology—diagnosing disease, designing vaccines, mapping cells, editing genomes—ultimately depends on our ability to read the language of molecules.

Along the way, students will also encounter the stories behind these discoveries. Much of what we now take as settled fact about the molecules of life was once little more than a bold hunch, a smudge on a glass slide that nobody believed, a line in a 1,600-year-old manuscript left unread for centuries, or a rejected grant proposal yellowing in a desk drawer. These are stories of people learning, molecule by molecule, to read life itself. The journey unfolds across three arcs — Seeing, Controlling, and Rewriting — tracing how humans first learned to make the invisible visible, then turned that vision into intervention, and is now beginning to rewrite life itself.`,time:"Tue-Fri 8:30 AM"},{id:"p33",name:"Dipyaman Ganguly",lsCode:"FC-0801-2",description:"This foundation course will engage in discussions synthesizing three relevant dimensions of the Science-Visual art symbiosis, viz. a) how artistic endeavours for recording observations have enriched the scientific pursuit and shaped the epistemic landscape (for example, how artworks by anatomists, astronomers and naturalists enriched the contemporaneous understanding about the natural world), b) how artistic imaginations have contributed to scientific contemplations and vice versa (from Leonardo to Heath Robinson’s caricatures), c) how aesthetics, in terms of morphogenesis and organismal behaviour as well as cognitive inclinations to art, emerged in the course of evolution (the science of colour, mate selection in the animal world and the neuroscience of visual aesthetics in humans).",time:"Tue-Thu 11:50 AM"},{id:"p34",name:"Sanjay Jain",lsCode:"FC-0801-3",description:"",time:"Wed-Fri 11:50 AM"},{id:"p35",name:"Somak Raychaudhury + Shraddha Karve",lsCode:"FC-0801-4",description:`Deconstructing Discoveries

Almost all high school graduates have studied science. However, the science they encounter is typically presented as a body of established knowledge—the products of science—rather than the processes through which discoveries and inventions are made. As a result, students often learn scientific facts in isolation, with little appreciation of the scientists behind the discoveries, the processes that led to them, or the important roles played by society, funding agencies, and research institutions in shaping the course of scientific inquiry.

The aim of this course is to introduce students to how science is actually done. It will examine how scientific discoveries and inventions are made; how society—including governments and the media—responds to them; how scientific recognition and prizes are awarded (or sometimes not awarded); and how the practice of science has evolved from the work of isolated individuals to Big Science, in which large international teams collaborate to address complex problems. Drawing on examples from biology, chemistry, astronomy, and physics, the course will demonstrate how observations, experiments, and discoveries have advanced our understanding of nature while illustrating the scientific method in practice. It will also foster an appreciation of scientific temper and examine the scientific basis of some of the major global challenges facing humanity today, including epidemics, climate change, and environmental pollution.

The course will be conducted through a combination of lectures, readings, discussions, and student seminars on topics assigned by the instructors. Students will also interview practicing scientists after reading selected papers from the primary scientific literature, participate in hands-on activities (such as constructing a double-helical DNA model and performing experiments with a simple pendulum), and stage scenes from the play Oxygen by Carl Djerassi and Roald Hoffmann to explore the human, historical, and social dimensions of scientific discovery.`,time:"Wed-Fri 3:00 PM"}],px=["p4","p2","p5","p3","p1"],mx=["p7","p8","p6"],gx=["p12","p10","p11","p9"],vx=["p15","p16","p13","p17","p14"],yx=["p21","p20","p18","p19"],wx=["p25","p24","p22","p23","p26"],xx=["p27","p29","p30","p28"],bx=["p32","p33","p34","p35","p31"],Sx={fc1:px,fc2:mx,fc3:gx,fc4:vx,fc5:yx,fc6:wx,fc7:xx,fc8:bx},On=fx,Oa=hx,kx=Sx;function ur(e){return(kx[e]||[]).map(t=>Oa.find(n=>n.id===t)).filter(t=>!!t)}function kn(e,t,{checkForDefaultPrevented:n=!0}={}){return function(o){if(e==null||e(o),n===!1||!o.defaultPrevented)return t==null?void 0:t(o)}}var Uo=globalThis!=null&&globalThis.document?w.useLayoutEffect:()=>{},Cx=Rl[" useId ".trim().toString()]||(()=>{}),Ex=0;function gs(e){const[t,n]=w.useState(Cx());return Uo(()=>{n(r=>r??String(Ex++))},[e]),e||(t?`radix-${t}`:"")}var Nx=Rl[" useInsertionEffect ".trim().toString()]||Uo;function Px({prop:e,defaultProp:t,onChange:n=()=>{},caller:r}){const[o,i,a]=Tx({defaultProp:t,onChange:n}),s=e!==void 0,l=s?e:o;{const h=w.useRef(e!==void 0);w.useEffect(()=>{const d=h.current;d!==s&&console.warn(`${r} is changing from ${d?"controlled":"uncontrolled"} to ${s?"controlled":"uncontrolled"}. Components should not switch from controlled to uncontrolled (or vice versa). Decide between using a controlled or uncontrolled value for the lifetime of the component.`),h.current=s},[s,r])}const u=w.useCallback(h=>{var d;if(s){const p=Ax(h)?h(e):h;p!==e&&((d=a.current)==null||d.ca
