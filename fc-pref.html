ption:"Course description TBD"},{id:"fc6",name:"Great Books",code:"FC-0601",description:"Course description TBD"},{id:"fc7",name:"Literature and the World",code:"FC-0701",description:"Course description TBD"},{id:"fc8",name:"Principles of Science",code:"FC-0801",description:"Course description TBD"}],T1=[{id:"p1",name:"Sumedha Basu",lsCode:"FC-0102-5",description:`# Environmental Studies

**Course Code:** FC-0102  
**Section Code:** FC-0102-5  
**Category:** Foundation Courses  
**Faculty:** Sumedha Basu [sumedha.basu@ashoka.edu.in]  

## Overview

Climate change is one of the biggest challenges of our time—and of the future. To respond to it, we first need to understand its wide-ranging relationships with nature, society and our everyday lives. Through this course, I seek to make these complex interrelationships accessible while building a strong analytical foundation for you. To this end, we will begin with the basics of climate science and the tools we use to study it. From there, we will engage with the different frameworks—both historical and current—that shape how people and governments think about climate change. Informed by these frameworks, we study the three key pillars of response: vulnerability assessment, mitigation, and adaptation.

 We will then explore the social, political, and economic dimensions that shape climate change and, in turn, are shaped by it. We finally examine the implications of these factors on our shared future. We look at alternative frameworks, technologies, and models gaining traction, and finally consider why hope in the era of climate change should be the new politics.

 The course will be taught through:

* Lectures to introduce core concepts
* Class discussions on cases and real-life examples
* Films and documentaries to visualise impacts and solutions
* Group projects to practice collaboration and problem-solving

 Throughout the course, we will learn about critical thinking, tools to comprehend the underlying layers of the challenge, assess the scope for resistance and create new pathways.

## Requirements (Reading List and other materials)

Attendance and Participation: Attendance in lectures and DS is compulsory. You are allowed 2 free misses in lectures, beyond which I will deduct points for every miss, unless it is an emergency. Attendance will be taken within the first 15 minutes of the class. If you’re more than 15 minutes late, you will be marked absent. Once the class starts, you must not leave the classroom before the end of the class, unless there’s an emergency, in which case, you should let one of the teaching team members know.

Quizzes: There will be three surprise quizzes during class. The best two of the three will be considered for the final grading.

Essays: There will be two essay-based assignments during the course. At least one would be a 500-word in-class, handwritten essay. The other would have a word limit of 1000 words.

Group Project: A group project will be designed in consultation with the teaching fellows. This will be announced within the first two weeks of the course.

More details about the assignments will be announced in due course.

## Attendance

3 excused absence(s) are allowed in this course lecture.

3 additional excused absence(s) are allowed for sportspersons in this course lecture.

Additional Comments:

General information

* We will use Google Classroom or other similar
  platforms to share materials and updates
* While there are suggested readings for each unit,
  more relevant readings (not more than two) may be shared prior to the lecture.
  Enough time will be provided to complete your reading.
* We will try to make the class as interactive as
  possible, depending on its size. However, you are also encouraged to schedule office hours with the team to discuss your challenges or perspectives.
* Your comments will be taken into account in
  designing the evaluation subjects.
* Late assignment submissions and late class entries are strongly discouraged. Repeated late class entries will attract a grade penalty.
* If these issues continue after an initial
  caution, they will be reflected in your grades.
* Consistent punctuality and timely work are
  expected as part of your academic responsibility.
* To ensure you are genuinely engaging with the
  material and developing your own understanding, the use of AI tools in
  assignments should be limited to structuring, editing, and improving
  language (for example, grammar, clarity, or formatting), if at all.
* Using AI to generate substantive content,
  arguments, or analysis is strongly discouraged. If your work is flagged
  by AI detection tools, you will be asked to explain your process and an unsatisfactory
  explanation or continued use will result in a grade penalty.
* While discussions and debates are highly
  encouraged, please maintain an atmosphere of mutual respect and collegiality and refrain from making personal comments.

**Course Code:** FC-0102  
**Section Code:** FC-0102-2  
**Category:** Foundation Courses  
**Faculty:** Asmita Kabra [asmita.kabra@ashoka.edu.in]  

## Overview

The course aims to introduce students to a complex, interdisciplinary understanding of environmental issues and challenges, going beyond simplistic discourses of crisis. The pedagogic design is built around ten questions, framed in very simple terms but designed to crack open disciplinary silos to build a multivalent understanding of linked socioecological systems. It exposes students to a diversity of environmental issues, challenges, processes, perspectives, and actors. The objective is to enable students to gain a more nuanced and historicized understanding of the politics of environmental policy and practice.

## Learning Outcomes

* To destabilise simplistic binaries of rural-urban, North-South, environment-development, local-global etc.
* To foster meaningful dialogue among diverse disciplinary and ideological perspectives
* To nudge students to think of their own role as embedded actors operating within structural constraints, but with agency to bring about change
* To understand socio-ecological systems as complex, contingent, and messy
* To generate critical hope and action pathways

## Requirements (Reading List and other materials)

The course will consist of twelve modules, each lasting approximately a week, with two lecture sessions of 1.5 hours each. Part I of the course walks students through the historical links between environment and development. It traces how these linkages have changed over time and are connected specifically to global geo-politics of the 20th and 21st centuries. Part II focuses on extant environmental solutions - mainstream as well as radical - again teasing out their ontological and epistemological foundations. This interdisciplinary course draws on theoretical insights from political economy, environmental and ecological economics, social anthropology, institutional theory, and cultural and political ecology. Students are expected to prepare in advance by reading short pieces and/or watching films or studying online resources. Classroom time will be devoted to lectures, discussion, and in-class activities, with follow-up readings assigned to dig deeper into the ideas thrown up during class.

**Weekly Teaching Plan**

* Week 1: Curtain raiser
* Week 2: What is the Anthropocene?
* Week 3: Are there too many people at this party?
* Week 4: How did we get here?
* Week 5: How has the world changed since World War II?
* Week 6: Why is everyone angry?
* Week 7: Can markets solve the polycrisis?
* Week 8: Are mainstream solutions working (for everyone)?
* Week 9: Where do we go from here?
* Week 10: Whose expertise can we count on?
* Week 11: Should we go back to living in caves?
* Week 12: Hope in the Anthropocene

**Readings**

**Course Code:** FC-0102  
**Section Code:** FC-0102-1  
**Category:** Foundation Courses  
**Faculty:** Amita Baviskar [amita.baviskar@ashoka.edu.in]  

## Overview

Any environmental issue is invariably about society and politics.  From global warming to garbage on city streets, nature and culture lie at the centre of competing claims about what should be done.  As Raymond Williams said, “We have mixed our labour with the earth, our forces with its forces too deeply to be able to separate each other out.”  Understanding these processes of ‘socio-nature’ demands a focus on social inequality as well as biological complexity.  This course looks at how biophysical processes in natural landscapes are changed by the cultural geography of capitalism, colonialism, caste and nationalism.  We will analyse environmental crises and explore how collective action can lead to ecological justice.

## Learning Outcomes

**Course Objectives**

- to appreciate the diversity and complexity of ecosystems

- to understand the long-term political-economic processes shaping environments

- to analyse current environmental problems in terms of unequal social causes and impacts

- to reflect on the connections between personal actions and planetary welfare

- to develop an interpretive frame that can be applied to understand and address a range of environmental problems

- to carefully read, critically appraise, and concisely write from a social science perspective

**Course Code:** FC-0102  
**Section Code:** FC-0102-3  
**Category:** Foundation Courses  
**Faculty:** Ghazala Shahabuddin [ghazala.shahabuddin@ashoka.edu.in]  

## Overview

**Overview:**

The contemporary world is beset with growing environmental problems. The global focus on economic growth and development has led us onto an unsustainable path: growing scientific evidence now suggests that the Earth may not be able to cope with the demands imposed on it.  This has created an urgent need to critically examine complex environmental issues from a variety of perspectives. It is necessary to inculcate holistic thinking on environmental challenges and their purported solutions, that includes concerns of social and ecological sustainability.

This course will discuss some of the most current concerns related to the environment, as well as societal responses to them, from a multidisciplinary perspective. Water scarcity, climate change, forest degradation, biological extinction, pollution and agrarian distress are some of the issues that will be studied. This course is intended to familiarise students with environmental problems  and engender a holistic perspective in understanding causes and possible solutions through the lenses of both science and equity. This course will encourage students to synthesize information across a variety of sources.

Practically the course will be taught using a combination of lectures, documentaries, slideshows, guest lectures and in-class group discussions. Discussion on assigned readings will engender critical thinking and debate in class. Students will undertake group projects on current case studies (such as river pollution, tiger tourism etc.). Assessments will be based on in-class tests, essays, group projects and class participation.

## Learning Outcomes

* The course will create an awareness of, and sensitivity to the complexities of contemporary environmental challenges;
* Students will learn to analyse environmental issues from a multidisciplinary perspective;
* Students will learn to think and write analytically about complex issues
* They will be taught to synthesize knowledge from different sources including scholarly papers, visual media and traditional knowledge.

**Course Code:** FC-0201  
**Section Code:** FC-0201-3

## Overview

This is a small course about a large and fascinating subject, that of Indian Civilizations. It has been structured in a way that it can be immersed in, one hopes, with enjoyment. The course will draw out civilizational elements from prehistory till the present – through accounts of travels and lives, through ideas and  through art – in which small phenomena are linked to the larger frame of the Indian subcontinent and beyond. The course will explore a varied and rich tapestry that includes rock art, the Harappan Civilization, iconic emperors like Ashoka and Akbar, the words of the Buddha and the Bhakti saints, modern statesmen like B.R. Ambedkar and Jawaharlal Nehru. How social and gender inequalities cut across Indian history will also  be explored.  Indian civilizations, as the course will emphasize, are not   part of the 'old' and  ‘dead’ past but  are made up of elements that continue to be present in contemporary India. Readings will be electronically shared with students.

## Learning Outcomes

A nuanced understanding of India's past and present through the civilizational lens

## Requirements (Reading List and other materials)

Readings will be electronically circulated.

Week One: Civilization

Is there an idea of Civilization? Is there an idea of India?

Sunil Khilnani. 1997 (1998 reprint). The Idea of India. London: Penguin Books, pp. 150-95. Chapter four (‘Who is an Indian?’).

Buddha and his contemporaries

## Overview

The study of India’s past in the modern period has produced diverse understandings of Indian civilizations. This course looks at some of the ways in which these understandings have evolved, by discussing the writing of history, notions of heritage, anti-colonial resistance, nationalist thought and memories of exile. We shall explore how histories of representative monuments, rulers, cities or commodities allow us to comprehend the historical processes that have shaped Indian civilizations.

## Learning Outcomes

To acquaint students with some of the methods historians have found useful for understanding India’s past; to introduce them to aspects of Indian civilizations; and provide some context to reflect on the meanings of civilization.

## Overview

This course takes an intellectual history approach to the study of Indian civilizations. It considers civilization as an actor category. It explores how different conceptualizations of civilization have shaped India, and how India has shaped the concept of civilization. We will focus mainly but not exclusively on British/Western colonialists and thinkers on one hand and South Asian intellectuals on the other to embark on a journey that will begin from the middle of the eighteenth century and go right up to the present.

## Learning Outcomes

The course will give students a fresh perspective on and a critical re-introduction to Indian history, how historical knowledge (including the kind of history that is taught in schools) is produced, and the many consequences of such knowledge in the making of our past, present, and future.

## Overview

The course will begin with pre-requisite tools of quantitative thinking vis-a-vis the number system, set theory, logic, proofs, probability and statistics. We will then learn how to use some of these tools to study (i) fairness in division of scarce resources, (ii) collective decisions in committees and democracies around the world (voting methods), and (iii) how to act optimally in competitive social interactions, i.e. game theory. By the end of the course, students would have a basic understanding of the most widely used mathematical tools in the liberal arts. They will learn how to approach different economic problems- by reducing them to their bare essentials (via modelling) and to mathematically analyse their underlying structural and logical patterns.

## Learning Outcomes

Students will be able to think quantitatively and mathematically across various disciplines and applications. They will learn to use mathematical symbols, to develop an intuition for proofs and to write formal arguments.

**Section Code:** FC-0306-3  
**Category:** Foundation Courses  
**Faculty:** Sandeep Juneja . [sandeep.juneja@ashoka.edu.in]  

## Overview

Mathematical ideas often based on data and analysis play a key role in understanding the world around us and in making rational decisions.  This course will focus on consequential real world problems and discuss the underlying mathematical ideas that illuminate the problem structure and help us make more informed and better decisions.

The questions we consider include the ones that rely on taming uncertainty such as

·      What do income inequality, damage from earthquakes and size of cities have in common?

·      How to estimate and manage supplies at an Ashoka Coffee shop

·      How do fashion stores decide how many clothes to order in a business cycle

·      How tools such as the Monte Carlo method help us measure and control disease spread

·      How to make profitable investments in stock markets

·      The underlying mathematical principles in pricing financial derivatives securities

As well as those that involve problems under certainty assumptions, such as

·      How do utility companies decide how much electricity to generate from various power sources (coal, natural gas, nuclear, solar, wind) hour by hour?

·      How to estimate a price of a home from data such as square footage, number of bedrooms, location rating, age of the property, and local crime rates.

·      How do banks feed historical customer data (income, debt, repayment history) into machine learning models to evaluate a new applicant's risk level and automatically approve or deny lines of credit

·      How can individual rational decisions lead to a collectively terrible outcome?

·      Can a group of men and women be matched in a stable manner so that there is no pair of individuals who would both prefer to leave their assigned partners to be with each other.

·      How Google finds the shortest path from your home town to Ashoka University

Along the way, students will encounter introductory ideas from probability, statistics, optimization, regression, machine learning, game theory, matching theory, and graph algorithms.  By the end of the course, students will be able to recognize mathematical structure in unfamiliar situations and reason carefully with data and uncertainty. The broader aim is to develop a form of intellectual independence: the ability to look beneath the surface of a problem and identify its underlying structure.

## Overview

This course introduces students to seminal writings on the intertwined trajectories of economy, politics, and society in the Indian subcontinent during the emergence of modernity. It traces the evolution of modern South Asia from 1818 to 1947, examining key social, political, and economic transformations under colonial rule.

We will explore major figures who engaged with — and shaped — the political and social struggles of the period, alongside critical debates on religious reform, women’s roles, caste hierarchies, communalism, and nation formation. Special attention will be given to the complexity of colonial governance, economic change, and social contestations.

Students will engage with a range of primary texts — including autobiographies, speeches, political treatises, ethnographies, and literary fiction — to analyze how ideas of economy, politics, and society were debated and reimagined in colonial South Asia.

**Course Goals:**

* Read, think, and evaluate critically about modern South Asian economy, politics, and society
* Acquire foundational knowledge of major historical and political developments in modern South Asia
* Understand key figures, movements, and debates that shaped South Asian society and politics under colonialism
* Examine the economic underpinnings of colonial rule and their impact on society and politics
* Understand the emergence and construction of communalism in the region
* Develop skills to critically analyze primary sources and debates

## Learning Outcomes

By the end of the course, students will be able to:

* Demonstrate understanding of the dominant themes in modern South Asian economic, political, and social history
* Analyze the impact of colonialism on South Asian society, politics, and economy, and its continuing legacy
* Critically evaluate both primary and secondary sources
* Synthesize information from historical texts, political writings, and non-traditional sources
* Engage analytically with concepts of modernity and their global and regional implications

3 excused absence(s) are allowed in this course lecture.

## Overview

What makes a society just, prosperous, and worth living in? Questions of the common good cannot be answered by economics, political science, sociology, philosophy, or environmental studies alone. They require us to move between moral ideas, empirical realities, institutional arrangements, and lived experience.

This foundation course examines how states, markets, communities, and other institutions organize collective life. We shall study how societies produce order, distribute resources, manage conflict, define belonging, respond to inequality, and confront environmental and technological change. Rather than treating states and markets as separate or opposing spheres, the course asks how they are historically constituted, socially embedded, and politically contested.

Students will learn to read across social science disciplines, reconstruct arguments, interpret evidence, and exercise judgment when reasonable people disagree. The aim is not to provide a single theory of the common good, but to develop the intellectual habits needed to think carefully about competing values, institutional choices, and their consequences.

## Overview

This course puts the I in EPS. Few social, political, or economic movements can be understood in isolation from their international context. Their triggers may be local, but the ideas, people, money, and technologies that mobilise them travel. We will therefore read economy, politics, and society in comparative perspective, unearthing shared intellectual undercurrents and the material impact of watershed events across time and geography. We will pay particular attention to global markets as shapers of political and social developments.

Rather than starting with theory, the course is organised around ebbs and flows in societies.  We will connect social upheaval to disruption in markets, understand the role coercion plays in international political economy, ground the origins of economic life in religion and dogma, and frame technology as a vehicle for political engineering. When we do go through canonical texts, it will mostly be to understand societies in convulsion: Luther's Europe, Smith's Scotland, Meiji Japan, Weimar Germany, Mao's China and Malviya’s Benares for example. Technology will play a starring role in this course -- and although you are not expected to have a legal background, we will occasionally analyse legal texts both as an instrument of powerful interests and a resistance tool for social movements.

## Overview

Does Caste Still Matter in India Today?

“Democracy in India is a top-dressing on an Indian soil which is essentially undemocratic.” These words by Dr. Ambedkar in the Annihilation of Caste continue to compel us to critically reflect upon the myriad hurdles that have kept India away from fully realizing its democratic potential. For Ambedkar, one of the main social cleavages that resisted notions of equality and social justice was the pervasive phenomenon of caste in India. Achieving political freedom, as Ambedkar presciently reminded everyone, was no guarantee for realizing social freedom. Seven decades after India’s independence, how deeply entrenched is this social idea of democracy in India today? More specifically, how do we understand the role of caste in the chequered story of India’s democracy? Should caste only be understood as a pernicious form of social hierarchy or can it also be seen as an entity that has shaped the rise of ‘lower-caste’ identity assertion and led to the socio-economic upliftment of marginalized sections?

This course will introduce students to debates and discussions around why, how and in what ways caste shapes different facets of everyday life in contemporary India. With a thematic focus around politics, society and economy, this course will offer varied perspectives to meaningfully approach a deceptively simple question – ‘Does Caste Still Matter in India?’. The course will be divided into 3 categories. The first section will deal with how caste became politicized after 1947 by focusing on the rise of caste-based political parties and social movements in Uttar Pradesh, Maharashtra, and Tamil Nadu. The second section will introduce students to how caste continues to operate as a form of social hierarchy through seemingly egalitarian spheres of food, music, sport and educational institutions. The final section will focus on the complex role caste plays in the Indian economy by dealing with conceptual issues like ‘caste and class’, along with thematic issues like caste-based discrimination in labour markets, the gig economy, the question of Dalit capitalism, among others. This course will encourage students to think critically about these issues in relation to how the story of Indian democracy has unfolded over the years. It will provoke students to think of caste as the ‘undemocratic soil’ of a rapidly urbanizing India, and not treat it as a past relic or as a phenomenon that rears its ugly head only among rural, ‘backward communities’ and in underdeveloped regions of India.

**Course Code:** FC-0503  
**Section Code:** FC-0503-2  
**Category:** Foundation Courses  
**Faculty:** Bittu R [bittu@ashoka.edu.in]  

## Overview

This course will introduce you to questions of mind and behaviour and their relationship to the brain and body, and will encourage you to think critically and scientifically through your own ideas around these relationships. In this course we will try to understand ourselves, the people and animals around us, and all the ways in which our interactions produce learning. Every conversation, every memory, even your reading of this course outline, structurally and functionally changes your brain, but not everything that the brain processes seems to make it to the realm of conscious perception. We will think about various seemingly intangible aspects of the mind and try to imagine how to make sense of them.

We will take a look at complex and interesting phenomena such as motivation, emotion, language, consciousness and attention. We will explore the specific question of how we learn, how we absorb and retain new material, the ways in which our brains tend to conflate correlation and causation, how we make decisions, and what critical thinking means. We will think through inter individual behavioural differences and what kinds of evidence we require to draw conclusions about group behaviour. We will focus on the limitations of what we collectively understand and the ways in which we might imagine advancing our collective knowledge about the mind and behaviour.

## Learning Outcomes

The goal of the course is to provide you with the tools with which to ask these questions and begin answering them. The specific learning outcomes we hope for are:

1. That you develop an understanding of critical scientific thinking as a method for thinking through major life decisions.

2.  That you lose your fear of primary scientific research and become comfortable going to the source of evidence - a necessary life skill

3. That you develop specific tools of critical scientific thinking: critiquing the scientist as observer, distinguishing pseudoscience from science, distinguishing correlation from causation, controlled experimental methods, distinguishing absolute versus relative changes in data, sampling, etc.

4. That you specifically learn about cautionary checks necessary to understanding behaviour: placebos, categorical validity, objectivity vs subjectivity, etc.

5. That you apply these methods to think through interesting questiong about mind and behaviour: pseudoscience in psychology, personality and IQ assessments, conformity bias, criminal and forensic psychology, neurodiversity, emotion, rationality, decision making, consiousness, AI and the self.

**Course Code:** FC-0503  
**Section Code:** FC-0503-1  
**Category:** Foundation Courses  
**Faculty:** Aarthy Vaidyanathan [aarthy.vaidyanathan@ashoka.edu.in]  

## Overview

Emotions, Responsibility, and Morality  
Anger can sometimes be counterproductive. Can such anger be morally valuable nonetheless? Blaming seems detrimental in some clinical contexts. How can clinical service providers hold users morally responsible for wrongdoing without blaming them? We sometimes judge actions as morally right or wrong. But what *makes* an action morally right or wrong?  This course will introduce you to such questions about emotions, responsibility, and morality from a philosophical perspective.

Sample readings:  
Rachels, ‘The Challenge of Cultural Relativism.’  
Selections from Mill, Utilitarianism  
Singer, ‘Famine, Affluence, and Morality’  
Pickard, ‘Responsibility without Blame’  
Srinivasan, ‘The Aptness of Anger’

## Learning Outcomes

Students of this course will learn to explain the core ideas we engage with clearly and succinctly. They will also learn to critically engage with philosophical arguments and to articulate and support their views.

## Overview

Memoirs by women that act as political beacons are the focus of this course. Each one is a stellar example of the genre we know as narrative non-fiction, and each one has been cited and referred to by generations of scholars, practitioners, activists, and students for whom equity and social justice are of importance. Over time, these memoirs have taken on a talismanic importance and yet, they age well with the times and remain supremely relevant. Is that something to celebrate in terms of the prescience of the texts themselves, or to lament in terms of how the world does not seem to become a more equitable place even over the decades since these texts were read for the first time.

The texts we will be reading: Karukku by Bama; The Prisons We Broke by Baby Kamble; Why Be Happy When You Can Be Normal by Jeanette Winterson; 'Memories of an un-Palestinian story, in a can of tuna' by Susan Abulhawa; Our Words, Our Stories by A. Revathi.

The final project which accounts for 50% of the course will be a group creative project based on any theme in the books we have read together during the semester and can take the form of a podcast, original song, short film, comic book, art installation, live performance, broadsheet or zine.

## Learning Outcomes

Studying texts from different cultures, chronologies, disciplines, and languages, the Great Books course introduces students to multiple ways of thinking and being in the world. As the semester progresses, students are encouraged to ask questions of the books or fragments of books they are reading. The intent is to familiarise students with how to engage with texts and not be intimidated by them, and in so doing, opening a door for students, inviting them into new landscapes of ideas, narratives, arguments, and experiences.

## Overview

This course seeks to reflect on care and love both conceptually and experientially. What does it mean to love and care for oneself and for others? What allows us to love and care? What prevents us from caring and loving ourselves and others? What forces—personal, interpersonal, or collective and communal—regulate, prescribe and even prohibit experiences and expressions of love.

Our primary goal in the course is to work towards developing a critical and comprehensive language around understanding care and love as the basis for any and all configurations of relationalities that both make and unmake our senses of being in the world. Beginning our journey with selections from The Symposium by Plato, verses from the Gatha Sattasai, and poetry from the Akam repertoire of Sangam literature, we will make our way through more contemporary iterations and meditations on caring and loving such as, Roland Barthes’ *A Lover’s Discourse* and Ocean Vuong’s *On Earth We Are Briefly Gorgeous*. All along the way we will be reflecting on and attempting to problematize “traditional” and “normative” structures within which care and love are usually understood and experienced.

## Learning Outcomes

To understand representations of caring and loving in literature and culture.

To contemplate and reflect on caring and loving experientially and critically.

To develop a critical lexicon for addressing the ethics of caring and loving.

**Course Code:** FC-0701  
**Section Code:** FC-0701-4  
**Category:** Foundation Courses  
**Faculty:** Vivek Venkitaraman Narayan [v.v.narayan@ashoka.edu.in]  

## Overview

Literature lives in a strange place where the word meets the world: here, the fantastical can seem familiar and the mundane may seem bizarre. The act of reading allows us to imagine the strange worlds of others as if we lived in them, and, equally, to reimagine our everyday worlds as if we viewed them through unfamiliar eyes. This imaginative encounter with otherness—other people, other perspectives, other places, and other worlds—lies at the heart of the literary experience.

In South Asia, the literary encounter with otherness is inextricable from the worldly encounters of caste. The aesthetics of caste inform our literary sensibilities, the social experiences of caste frame the world we inhabit, and the everyday performances of caste shape our bodies. In short, the encounters that create our aesthetic, social, and embodied experiences—between the word and the world, between the self and the other, and between the real and the imagined—are all entangled with caste.

This course will examine the relationship between literature and the world by focussing on the aesthetic, social, and embodied experiences of caste. We will ask: What can caste and literature tell us about each other? What do the intersections of caste and literature tell us about the world? How does our experience of the world inform and inflect our responses to literary representations of caste? And, perhaps most important, how will this kind of literary experience help us inhabit the world? We will read fiction, nonfiction, poems, and plays to explore what literature can reveal about others, ourselves, and a world organized by caste.

**Course Code:** FC-0701  
**Section Code:** FC-0701-2  
**Category:** Foundation Courses  
**Faculty:** Jonathan Gil Harris [jgharris@ashoka.edu.in]  

## Overview

This class begins with the premise that every story is a migrant.  A story migrates in a variety of ways – from the teller to the audience or reader; but also from reader to reader, place to place, and culture to culture, as the story gets told and retold (or written and rewritten) over space and time.

We live in a capitalist age when ideas of private property have subtly colonized how we think about stories.  It is assumed that a story is always BY someone, and is therefore their possession.  But if stories migrate, can a single author really claim full ownership of the story she has written?  How is every story a re-imagining of another story, or many stories, that have become before?

The notion that a story is an author’s private intellectual property also inhibits how we read.  Readers become potential trespassers; they must pay the price of admission, and then act respectfully when they enter the property, making sure not to damage or alter it.  If you are a student of literature, it’s likely that the command to respect an author’s private property will be accompanied by the assumption that the objective of literary analysis is simply to understand what the author intended, and to submit to that deferentially.  But if stories migrate from teller to reader, and from reader to reader and culture to culture, maybe the act of reading should not be thought of just as a respectful encounter with an author’s private property.  Every act of reading instead becomes a creative re-imagining of the story, in conversation with new potential readers and audiences.

If stories are migrants, then they are no longer individual property by authors who command their readers.  They are collective artefacts that invite us to respond creatively and re-imagine them anew.

If you doubt what I am saying, think this.  Do any two readers respond exactly the same way to a story?  Each reader, when asked about a story and what it meant, will retell it slightly differently.  Recognizing that reading is a form of creative re-imagining is one of this course’s most important themes.

As stories migrate across space, time, and languages, they are re-imagined by the world across many genres and media – poems, plays, novels, essays, films, graphic novels.  These re-imaginings might prove that, in literature, there is nothing original under the sun.  Yet how literature reimagines earlier stories also tells us a lot about the extraordinarily diverse ways in which different cultures have understood the world: relations between men and women, relations between diverse ethnicities and religions, the nature of political and social power, humans’ relations to the animal and plant world, the agonies and ecstasies of love, and the nature of imagination itself.

How, for example, is a Roman re-imagining of an old Greek story about an Asian witch re-imagined by an English playwright in an “American” drama that has itself been re-imagined in very different ways by writers and artists from the Caribbean, Sierra Leone, Mauritius, and Samoa?  How is a Roman re-imagining of a Babylonian (ie Iraqi) love story reworked by the same English playwright in a Greek mythic tale with an Asian subtext that gets in turn re-imagined by a Bombay director in Hindi, Punjabi, Urdu and English as well as by an English graphic novelist in a reworking of an American comic-book hero’s saga based on a character from a German short story?  And how is an antique Persian story about an African migrant re-imagined in an Arab novel and then re-imagined by the same English playwright, whose play is then diversely re-imagined by a Sudanese novelist and a Hindi film-maker from Uttar Pradesh?

**Course Code:** FC-0701  
**Section Code:** FC-0701-3  
**Category:** Foundation Courses  
**Faculty:** Saikat Majumdar [saikat.majumdar@ashoka.edu.in]  

## Overview

What is liberal arts education? Is it identified with particular subjects, or a certain style of teaching and learning? This course will offer an introduction to liberal arts education as it might be practiced in a literature classroom for non-specialists, including students who may major in any subject at Ashoka – a be it literature, economics, or biology. Our focus will be on English as a world language, and particularly one of global literature. How did the British Empire shape a global terrain of colonial modernity? How did that modernity merge with Anglo-American globalization of the twentieth and twenty-first centuries? How did this create the English-speaking and English-reading worlds, and how did it turn English into a

language of world literature? We will examine the transnational trajectory of this diverse and diffuse body of writing, including work from spaces with vastly different histories – the colonies in sub-Saharan Africa, the Caribbean and South Asia, and the hard-to-classify context of South Africa.

Evaluation: Attendance: 10%; Group presentation: 20%; Midterm: 30%; Final Exam: 40%; DS Attendance: 10%

**Course Code:** FC-0801  
**Section Code:** FC-0801-5  
**Category:** Foundation Courses  
**Faculty:** Sujan Kumar Sengupta [sujan.sengupta@ashoka.edu.in]  

## Overview

**Planet Earth: Its status in the Universe, potential threats and the ultimate fate.**

  A formidable combination of astronomical and geological conditions has made it possible for the Earth to harbour life on it. But there are many catastrophic events in the space that may destroy life, even the planet which in the vast cosmic arena appears as a mote of dust suspended in a beam of sunlight and floating in the vast emptiness of space.  Search for extra-terrestrial life has taught us an important lesson that our world, mother Earth is an extremely rare place in our galaxy and possibly the only planet that has the required astrophysical and geological conditions for harbouring life. Even if there are other planets similar to the Earth wherein life may exist, the number of such planets in the vast galaxy is extremely small and so we are alone at least within a radius of few hundreds of light years. 

    This course will unfold the fact that our home, the planet Earth is so special yet so vulnerable, so crowded yet so lonely, so common yet so unique, so insignificant yet so great! 

        The following topics will be covered in the whole course: 

    (i)   Our address in the Universe, the boundary of the solar system, the solar neighbourhood and the hierarchy in the structure of the                              visible Universe. A brief history of the solar planets.  

   (ii)   Birth of the Sun and its planets including the Earth. We are made of star dust – the origin of heavy elements including carbon- the building block of organic molecules. 

  (iii)   The Solar family – Mercury, Venus, Mars, Jupiter, Saturn, Uranus and Neptune. Pluto and the other dwarf planets. Moons of the solar planets. 

  (iv)   Planet Earth – its evolving geology and the atmosphere. The Oceans- where has so much water come from? The ecological system.   

   (v)   Life is a puzzle: Definition of life- its main functions: metabolism, replication and evolution by natural selection.  Origin of life on the Earth. The Extremophiles  

  (vi)   The potential threats to the Earth – Astronomical, Geological and Man-made threats. Extinction of life in the past. 

### (vii)  The natural protection for life – The extremely rare combination of astronomical and geological coincidences that has enabled   life on the Earth to survive and evolve.

### (viii)   Are we alone? Search for extra-terrestrial bio-signature and techno-signature.

  (ix)  The evolution of the Sun – from a faint young star to a red giant and a changing environment of the Earth – from habitable to    uninhabitable planet. 

   (x)  The death of the Sun and the fate of its planets.

## Learning Outcomes

Basic knowledge and understanding on the formation of the Sun and the Solar system alongwith the planet Earth; Earth's evolution and ecology; Origin, evolution and extinction of life; Search for Extra-terrestrial life; Future of planet Earth and life on it.

## Requirements (Reading List and other materials)

(1) Physics of the Earth by Frank D Stacey and Paul M Davis, Cambridge University Press

(2) Handbook of Astrobiology edited by Vera M. Kolb, CRC Press

(3) Pale Blue Dot : A Vision of the Human Future in Space by Carl Sagan , Ballantine Books Inc, NY

(4) Worlds Beyond Our Own : The Search for Habitable Planets by Sujan Sengupta, Springer International

**Course Code:** FC-0801  
**Section Code:** FC-0801-1  
**Category:** Foundation Courses  
**Faculty:** Abhishek Mazumder [abhishek.mazumder@ashoka.edu.in]  

## Overview

Biology is often introduced as a tidy catalogue of organisms, organs, and processes—a view of life described from the outside in. This course argues that to truly understand biology, one must first understand its molecules, and that most biological phenomena emerge from the choreography of molecules colliding, binding, folding, and breaking apart. As the course unfolds, students will discover that nearly every major breakthrough and intervention in modern biology—diagnosing disease, designing vaccines, mapping cells, editing genomes—ultimately depends on our ability to read the language of molecules.

Along the way, students will also encounter the stories behind these discoveries. Much of what we now take as settled fact about the molecules of life was once little more than a bold hunch, a smudge on a glass slide that nobody believed, a line in a 1,600-year-old manuscript left unread for centuries, or a rejected grant proposal yellowing in a desk drawer. These are stories of people learning, molecule by molecule, to read life itself. The journey unfolds across three arcs — Seeing, Controlling, and Rewriting — tracing how humans first learned to make the invisible visible, then turned that vision into intervention, and is now beginning to rewrite life itself.

## Learning Outcomes

By the end of this course, students will appreciate why molecules are the language in which biology is written and will leave with a curiosity-driven understanding of how living systems are seen, controlled, and rewritten at the molecular level. They will engage with the stories — scientific, historical, and human — behind major discoveries in modern biology, and develop the critical-thinking habits needed to weigh evidence, ask better questions, and recognise both the promise and the responsibility that come with this field.

## Requirements (Reading List and other materials)

Reading List (interesting pieces but not essential for taking the course):

Fischer, H. "On haemin and the relationships between haemin and chlorophyll." Nobel Lecture, 11 December 1930.

Shimomura, O. "Discovery of Green Fluorescent Protein." Nobel Lecture, 8 December 2008.

Hooke, R. Micrographia. Royal Society, 1665.

Ford, B. J. Single Lens: The Story of the Simple Microscope. Harper & Row, 1985.

Maddox, B. Rosalind Franklin: The Dark Lady of DNA. HarperCollins, 2002.

Mukherjee, S. The Gene: An Intimate History. 2016.

Editorial. "Water with sugar and salt." The Lancet 312 (1978): 300–301.

Tu, Y. "Artemisinin — a gift from traditional Chinese medicine to the world." Nobel Lecture, 7 December 2015.

Chin, J. W. "Expanding and reprogramming the genetic code." Nature 550 (2017): 53–60.

Doudna, J. A., and Sternberg, S. H. A Crack in Creation: Gene Editing and the Unthinkable Power to Control Evolution.

Service, R. F. "The game has changed. AI triumphs at protein folding." Science 370 (2020): 1144–1145.

The final letter grades in this course will be determined as per Relative grading

Student performance in this course will be assessed using a relative grading system. Rather than assigning grades based on fixed score thresholds, students will be evaluated in comparison with the overall performance of the class. Final letter grades will therefore reflect a student's relative standing within the cohort.

Assessment will be divided into three independent components, each of which will be relatively graded separately:

1. Classroom Assessments (70%) – Includes in-class or take-home assessments conducted throughout the semester.
2. Attendance and Participation (10%) – Based on regular attendance, active engagement in class discussions, participation in activities, and contribution to the learning environment.
3. Essay (20%) – A 3–4-page essay on the student's chosen *Molecule of Life*, evaluated on originality, scientific understanding, clarity of writing, organization, and effective use of evidence.

Relative grading will be performed independently within each of these three components. The weighted scores from the three components (70%, 10%, and 20%, respectively) will then be combined to determine each student's overall course performance and final letter grade.

**Course Code:** FC-0801  
**Section Code:** FC-0801-2  
**Category:** Foundation Courses  
**Faculty:** Dipyaman Ganguly [dipyaman.ganguly@ashoka.edu.in]  

## Overview

This foundation course will engage in discussions synthesizing three relevant dimensions of the Science-Visual art symbiosis, viz. a) how artistic endeavours for recording observations have enriched the scientific pursuit and shaped the epistemic landscape (for example, how artworks by anatomists, astronomers and naturalists enriched the contemporaneous understanding about the natural world), b) how artistic imaginations have contributed to scientific contemplations and vice versa (from Leonardo to Heath Robinson’s caricatures), c) how aesthetics, in terms of morphogenesis and organismal behaviour as well as cognitive inclinations to art, emerged in the course of evolution (the science of colour, mate selection in the animal world and the neuroscience of visual aesthetics in humans).

## Requirements (Reading List and other materials)

All reading materials will be provided in the respective classes.

**Course Code:** FC-0801  
**Section Code:** FC-0801-4  
**Category:** Foundation Courses  
**Faculty:** Shraddha Karve [shraddha.karve@ashoka.edu.in]; Somak Raychaudhury [somak.raychaudhury@ashoka.edu.in]  

## Overview

This course concerns the nature of Time and the important role it plays in our lives. It introduces the concept of age and time in the context of Physics and Astronomy- how Time is measured, its connection with Space, and why it moves in one direction, as well as the way Time is perceived in biological systems. Through this course we would be like to bring to the students our current understanding about the scale and age of the Universe, and how this knowledge has evolved; how biological systems including human body maintain temporal patterns; the impact of climate change and ecological damage on biological time and the evolution of survival strategies that require the understanding of past, present and future.

The course will start with a general introduction and historical perspective to the concept of time in our day-to-day life and in physics and in biology. We shall discuss the history of measurement of time and invention of clocks. Without involving much mathematics, the course will help students derive relationship between speed of light and time, space-time continuum, age of the universe, stars, earth etc. We would then follow concept of time in biology in the context of birth-growth-ageing-death. Seasonal variations in morphological and life-history traits as measurement of time, mechanism of timekeeping - biological clocks, circadian rhythms. We will also discuss the evolutionary time and the important concepts pertaining to our understanding of this such as generation time of different living beings. The course ends with discussions on human cognition and the concept of time: conceptual understanding of past, present and future.

The course is taught through lectures, discussions, flip-the-classroom mode (students making presentations on various related topics), reading books/watching movies and writing assignments.

## Learning Outcomes

1.     Our current understanding about the scale and age of the Universe, and how this knowledge has evolved.

2.     Understanding how Astronomers and Geologists measure time and age, and how reliable these measurements are.

3.     Appreciation for different scales of time in biology: from timescales of biomolecules to the evolutionary timescale.

4.    Understanding of interdependencies in biological timescales.
